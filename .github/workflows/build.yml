name: Build installable packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.target }} / x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-22.04
            image: ubuntu:22.04
            format: deb
          - target: ubuntu-24.04
            image: ubuntu:24.04
            format: deb
          - target: debian-12
            image: debian:12
            format: deb
          - target: debian-13
            image: debian:13
            format: deb
          - target: fedora-44
            image: fedora:44
            format: rpm
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      RD_LINUX_TARGET: ${{ matrix.target }}
      PACKAGE_FORMAT: ${{ matrix.format }}
    steps:
      - name: Install native build and desktop dependencies
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates git python3 python3-dev python3-pip python3-venv \
              python3-tk binutils gcc dpkg-dev tar gzip xvfb xauth \
              xdg-utils desktop-file-utils fonts-dejavu-core
          else
            dnf install -y \
              ca-certificates git python3 python3-devel python3-pip python3-tkinter \
              binutils gcc rpm-build tar gzip findutils file \
              xorg-x11-server-Xvfb xorg-x11-xauth xdg-utils desktop-file-utils dejavu-sans-fonts
          fi
      - uses: actions/checkout@v7
      - name: Compile and run the native test suite
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          xvfb-run -a ./packaging/linux/build.sh
          python packaging/linux/package.py --format "$PACKAGE_FORMAT" --target "$RD_LINUX_TARGET"
          desktop-file-validate packaging/linux/rd-desktop.desktop
      - name: Install the package and check the installed executable
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_FORMAT" == deb ]]; then
            dpkg --install dist/*.deb
          else
            rpm --install dist/*.rpm
          fi
          cd /tmp
          /usr/bin/rd-desktop --self-test
      - name: Create archive checksums
        run: .venv/bin/python packaging/checksums.py dist --output "SHA256SUMS-linux-$RD_LINUX_TARGET.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: RD-Desktop-Linux-${{ matrix.target }}-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows / x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Compile and check the Windows executable
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - run: python packaging/checksums.py dist --output SHA256SUMS-windows-x64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: RD-Desktop-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python / wheel and source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Install the wheel outside the source tree
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rd-desktop-wheel"
          "$RUNNER_TEMP/rd-desktop-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rd-desktop-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/rd-desktop-wheel/bin/python" -m rdclient --self-test
          "$RUNNER_TEMP/rd-desktop-wheel/bin/python" -c 'from rdclient.ui_assets import icon_png; assert icon_png("download", 24, "#28794D")'
      - run: python packaging/checksums.py dist --output SHA256SUMS-python.txt
      - uses: actions/upload-artifact@v7
        with:
          name: RD-Desktop-Python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
