name: Build release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - pyproject.toml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check project version and existing tags
        id: version
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; from rdclient import __version__; from rdclient.constants import APP_VERSION; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert version == APP_VERSION == __version__, "Application and package versions must match"; print(version)')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Release tag does not match project version $version"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag" && [[ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::$tag does not point to this commit."
              exit 1
            fi
            echo "::notice::$tag is already published. CI will build this change; bump the version to publish a new release."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Compile release packages
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish verified packages
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify and consolidate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for manifest in SHA256SUMS-*.txt; do
            sha256sum --check "$manifest"
          done
          rm SHA256SUMS-*.txt
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python packaging/release_notes.py --tag "$RELEASE_TAG" --output release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --latest
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --notes-file release-notes.md --title "RD Desktop $RELEASE_TAG" --latest
          fi
      - name: Retire the mistakenly numbered development release
        if: needs.prepare.outputs.tag == 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Keep its assets in a recoverable draft; only remove the known development tag.
          if old_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v1.3.2" --jq '.object.sha' 2>/dev/null); then
            if [[ "$old_sha" != 0d6f20e328e909e0bbfdf86b246d85ed5294f6fb ]]; then
              echo '::error::The development tag has changed; inspect it before retiring it.'
              exit 1
            fi
            gh release edit v1.3.2 --draft
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/v1.3.2"
          fi
