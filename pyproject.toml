[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-desktop"
version = "1.3.2"
description = "Cross-platform desktop client for Real-Debrid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "keyring>=25.5,<26; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
rd-desktop = "rdclient.launcher:main"

[tool.setuptools]
packages = ["rdclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
rdclient = ["assets/*.json"]
